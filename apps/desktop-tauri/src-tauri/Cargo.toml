[package]
name = "workbench-desktop-tauri"
version = "0.1.0"
description = "Pi Workbench desktop application with a bundled Runtime Host"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[lib]
name = "workbench_desktop_tauri"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "workbench-desktop-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.23.1"
getrandom = "=0.4.3"
libc = "=0.2.189"
process-wrap = { version = "=10.0.0", default-features = false, features = [
  "creation-flags",
  "job-object",
  "kill-on-drop",
  "process-group",
  "tokio1",
] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-shell = "=2.3.6"
thiserror = "=2.0.20"
tokio = { version = "=1.47.1", features = [
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
url = "=2.5.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
