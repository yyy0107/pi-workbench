name: PTY native build and release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  native-matrix:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: win32-x64
          - runner: windows-11-vs2026-arm
            target: win32-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
          - runner: ubuntu-24.04
            target: linux-x64-glibc
          - runner: ubuntu-24.04-arm
            target: linux-arm64-glibc
    env:
      CI: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      WORKBENCH_NODE_PTY_EXPECTED_TARGET: ${{ matrix.target }}
      WORKBENCH_NODE_PTY_NATIVE_BUILD_MANIFEST: ${{ github.workspace }}/.desktop-build/node-pty-native/${{ matrix.target }}/node-pty-native-build.json
    steps:
      - name: Check out the tagged or proposed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm 11.22.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Install Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Validate release tag, version, and main commit
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/validate-release-tag.mjs "${{ github.ref_name }}"

      - name: Install Linux native compiler prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes build-essential python3

      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile and attest node-pty on this Runner
        run: pnpm --filter @workbench/terminal-server run native:pty:build

      - name: Test native artifact policy
        run: pnpm --filter @workbench/host-artifact-policy test

      - name: Test Runtime native artifact production
        run: node --no-warnings=ExperimentalWarning --import ./scripts/register-typescript-test-loader.mjs --test apps/runtime-node/test/runtime-artifact-builder.test.ts

      - name: Test Electron native reuse and packaged tree equivalence
        run: node --test apps/desktop-electron/test/native-runtime.test.cjs apps/desktop-electron/test/after-pack.test.cjs

      - name: Test release matrix aggregation
        run: node --test scripts/validate-pty-release-matrix.test.mjs scripts/prepare-pty-release-assets.test.mjs scripts/release-update-info.test.mjs

      - name: Typecheck native artifact consumers
        run: pnpm --filter @workbench/runtime-node typecheck && pnpm --filter @workbench/desktop-electron typecheck

      - name: Build and smoke the Web Node Runtime
        run: pnpm --filter @workbench/runtime-node build:artifact && pnpm --filter @workbench/runtime-node smoke:native

      - name: Build the Web artifact
        run: pnpm --filter @workbench/web build && pnpm --filter @workbench/web smoke:standalone

      - name: Build and smoke the Electron Runtime
        run: pnpm --filter @workbench/desktop-electron build && pnpm --filter @workbench/desktop-electron smoke:native

      - name: Upload PR native evidence
        if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: pty-native-evidence-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ${{ env.WORKBENCH_NODE_PTY_NATIVE_BUILD_MANIFEST }}
            .desktop-build/runtime-node/**/artifact-manifest.json
            .desktop-build/runtime-node/**/native-runtime-inventory.json

      - name: Build unsigned Electron packages
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm --filter @workbench/desktop-electron dist:artifact --publish never

      - name: Prepare target release assets and checksums
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/prepare-pty-release-assets.mjs --target "${{ matrix.target }}" --output "release-assets/${{ matrix.target }}"

      - name: Upload target release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          path: release-assets/${{ matrix.target }}/

  release:
    name: Publish unsigned release
    if: startsWith(github.ref, 'refs/tags/')
    needs: native-matrix
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release metadata validators
        uses: actions/checkout@v4

      - name: Install Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Download all six target assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-downloads

      - name: Verify exact target matrix, versions, and checksums
        run: node scripts/validate-pty-release-matrix.mjs release-downloads "${{ github.ref_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Pi Workbench ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            These artifacts are unsigned. Windows code signing, Apple signing/notarization,
            and update credentials must be supplied separately. Per-target automatic-update metadata
            is included; unsigned macOS builds cannot install updates until signing is configured.
          files: release-downloads/**/*
